name: ciro_app
description: "CIRO — Crisis Intelligence & Response Orchestrator (Mobile Dashboard)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Networking & API
  dio: ^5.7.0
  web_socket_channel: ^3.0.2
  retrofit: ^4.4.1

  # Data & Serialisation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Routing
  go_router: ^14.8.1

  # UI & Maps
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.12.1
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  retrofit_generator: ^9.1.7
  riverpod_generator: ^2.6.3

  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
